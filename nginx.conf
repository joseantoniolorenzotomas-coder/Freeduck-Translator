# Freeduck-Translator — configuración nginx
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Aislamiento cross-origin: lo exige el WASM con hilos (voz natural).
    # 'credentialless' no rompe las descargas con CORS (modelos, voces, API).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Tipos que algunos nginx antiguos no traen
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        application/manifest+json webmanifest;
        application/wasm wasm;
        application/octet-stream bin;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/x-icon ico;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Los modelos (~50 MB) se sirven tal cual; la caché de la app
    # (Service Worker + Cache API) gestiona el sin conexión.
}
